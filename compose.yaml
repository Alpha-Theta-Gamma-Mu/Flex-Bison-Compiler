# @see https://docs.docker.com/compose/compose-file/
name: "ar-edu-itba-72-39"

# @see https://docs.docker.com/reference/compose-file/extension/
x-shared:
  environment: &environment
    ENVIRONMENT: "${ENVIRONMENT:-Local}"
    LOG_IGNORED_LEXEMES: "${LOG_IGNORED_LEXEMES:-true}"
    LOGGING_LEVEL: "${LOGGING_LEVEL:-ALL}"

networks:
  ar-edu-itba-72-39:
    attachable: true
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    driver: "bridge"
    name: "ar-edu-itba-72-39"

services:
  compiler:
    build:
      context: "."
      dockerfile: "src/main/docker/compiler/Dockerfile"
    develop:
      watch:
        - action: rebuild
          path: "src/main/docker/compiler/"
    env_file:
      - path: ".env"
        required: false
    environment:
      <<: *environment
    networks:
      ar-edu-itba-72-39:
        aliases:
          - "compiler.72-39.itba.edu.ar"
    ports:
      - "127.0.0.1:${GDB_LISTENING_PORT:-2345}:2345/tcp"
    user: "ubuntu:ubuntu"
    volumes:
      - ".:/home/ubuntu/Flex-Bison-Compiler"
    working_dir: "/home/ubuntu/Flex-Bison-Compiler"
